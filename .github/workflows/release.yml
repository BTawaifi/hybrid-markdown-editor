name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Requires the NPM_TOKEN repository
# secret (an npm automation token). Provenance links the package to this workflow run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --no-audit --no-fund
        if: steps.published.outputs.skip != 'true'
      - name: Tag matches package.json version
        if: steps.published.outputs.skip != 'true'
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
        if: steps.published.outputs.skip != 'true'
      - run: npm test
        if: steps.published.outputs.skip != 'true'
      - run: npm run build
        if: steps.published.outputs.skip != 'true'
      - run: npm publish --provenance --access public
        if: steps.published.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
