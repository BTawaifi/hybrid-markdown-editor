name: Refresh dependency lockfile (temporary)

on:
  push:
    branches: [feat/chatgpt-markdown-renderer]
    paths:
      - .github/workflows/refresh-lockfile.yml
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh lockfile for verified current stable dependencies"
            git push origin HEAD:feat/chatgpt-markdown-renderer
          fi
