name: Update dependency lockfile (temporary)

on:
  push:
    branches: [feat/chatgpt-markdown-renderer]
    paths:
      - .github/workflows/update-lockfile.yml
      - package.json

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.repository == 'BTawaifi/hybrid-markdown-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock math and highlighting dependencies"
            git push origin HEAD:feat/chatgpt-markdown-renderer
          fi
