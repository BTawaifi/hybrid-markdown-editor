name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Report outdated dependencies
        run: npm outdated || true

      - name: Type-check public and internal code
        run: npm run typecheck

      - name: Run regression suite
        run: npm test

      - name: Build package
        run: npm run build

      - name: Smoke-test runtime exports and declaration files
        run: |
          node -e "const x = require('./dist/index.js'); if (typeof x.ChatMarkdownRenderer !== 'function' || typeof x.HybridMarkdownEditor !== 'function') process.exit(1)"
          node --input-type=module -e "import {ChatMarkdownRenderer, HybridMarkdownEditor} from './dist/index.mjs'; if (typeof ChatMarkdownRenderer !== 'function' || typeof HybridMarkdownEditor !== 'function') process.exit(1)"
          test -s dist/index.d.ts
          test -s dist/ChatMarkdownRenderer.d.ts
          test -s dist/HybridMarkdownEditor.d.ts
          node -e "const x = require('./dist/lite.js'); if (typeof x.ChatMarkdownRenderer !== 'function' || typeof x.HybridMarkdownEditor !== 'function') process.exit(1)"
          node --input-type=module -e "import {ChatMarkdownRenderer, HybridMarkdownEditor} from './dist/lite.mjs'; if (typeof ChatMarkdownRenderer !== 'function' || typeof HybridMarkdownEditor !== 'function') process.exit(1)"
          test -s dist/lite.d.ts
          # The lite entry must not pull in KaTeX or highlight.js.
          ! grep -l "katex\|highlight.js" dist/lite.js dist/lite.mjs $(grep -o "chunk-[A-Z0-9]*\.mjs" dist/lite.mjs | sed 's|^|dist/|')
          # Components keep their client directive for React Server Components.
          head -c 20 dist/index.mjs | grep -q "use client"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
